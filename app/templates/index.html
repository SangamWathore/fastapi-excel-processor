
<!DOCTYPE html>
<html>
<head><title>Excel Upload</title></head>
<body>
    <h1>Upload Excel File</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".xlsx" required>
        <input type="submit" value="Upload">
    </form>
</body>
</html>
